<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnVideo — 목소리 듣고 고르기</title>
    <!-- PWA(앱 설치) — 예전 그대로 복원 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c0562a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OnVideo" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
    <style>
      .voice-groups { display: flex; flex-direction: column; gap: 26px; }
      /* 넓은 PC 화면에서 목소리 카드가 휑하지 않게 여러 열로 꽉 채움(좁으면 자동 1열) */
      .vgroup { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-items: start; }
      .vgroup .vg-title, .vgroup .vg-desc { grid-column: 1 / -1; }
      .vg-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
      .vg-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
      .vcard {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px;
      }
      .vcard .play {
        width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; border: none; cursor: pointer;
        background: var(--grad); color: #fff; font-size: 20px;
      }
      .vcard .play.loading { opacity: 0.5; }
      .vcard .vmeta { flex: 1; }
      .vcard .vname { font-weight: 800; font-size: 15px; }
      .vcard .vgender { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; }
      .vcard .vtip { font-size: 12.5px; color: var(--teal); margin-top: 4px; }
      .vcard.playing { border-color: var(--teal); }
      .back-link { color: var(--accent); text-decoration: none; font-size: 14px; }
      /* 내가 만든 영상 — 관리용 컴팩트 그리드(영상 많아져도 한눈에). PC 다열, 모바일 2열. */
      .mypf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; align-items: start; } /* 가로·세로 카드 섞여도 위 정렬(빈공간 방지) */
      .mypf-grid .pf-card h3 { font-size: 14px; }
      .mypf-grid .pf-card figcaption { padding: 12px 12px 14px; }
      .pf-made { font-size: 11.5px; color: var(--muted, #888); font-weight: 600; margin: 4px 0 0; }
      .pf-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
      .pf-actions button { border-radius: 11px; padding: 9px 14px; font-size: 12.5px; font-weight: 800; cursor: pointer; border: none; letter-spacing: -.2px; display: inline-flex; align-items: center; gap: 5px; transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
      .pf-actions button:hover { transform: translateY(-2px); }
      .pf-zoom { background: linear-gradient(135deg, var(--teal), var(--purple)); color: #fff; box-shadow: 0 3px 12px rgba(107,76,240,.3); }
      .pf-zoom:hover { box-shadow: 0 7px 20px rgba(107,76,240,.45); filter: brightness(1.06); }
      .pf-ig { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; box-shadow: 0 3px 12px rgba(220,39,67,.38); }
      .pf-ig:hover { box-shadow: 0 7px 20px rgba(220,39,67,.52); filter: brightness(1.06); }
      .pf-yt { background: linear-gradient(135deg,#ff3b3b,#cc0000); color: #fff; box-shadow: 0 3px 12px rgba(255,0,0,.32); }
      .pf-yt:hover { box-shadow: 0 7px 20px rgba(255,0,0,.46); filter: brightness(1.06); }
      .pf-yt:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
      .pf-fb { background: linear-gradient(135deg,#1877f2,#0a5fd1); color: #fff; box-shadow: 0 3px 12px rgba(24,119,242,.34); }
      .pf-fb:hover { box-shadow: 0 7px 20px rgba(24,119,242,.5); filter: brightness(1.06); }
      .pf-th { background: linear-gradient(135deg,#333,#000); color: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.34); }
      .pf-th:hover { box-shadow: 0 7px 20px rgba(0,0,0,.5); filter: brightness(1.3); }
      .pf-del { background: transparent !important; border: 1.5px solid var(--line) !important; color: var(--muted); }
      .pf-del:hover { border-color: #ff6b5e !important; color: #ff6b5e; }
      .pf-yt-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: #ff4d4d; text-decoration: none; }
      /* 컴팩트 썸네일 카드 — 세로로 안 길어지게 */
      .pf-thumb-card { cursor: pointer; }
      .pf-thumb { position: relative; aspect-ratio: 9/16; background: #000; border-radius: 12px 12px 0 0; overflow: hidden; }
      .pf-thumb.land { aspect-ratio: 16/9; } /* 롱폼=가로 썸네일 */
      .pf-thumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
      .pf-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); opacity: .92; }
      .pf-yt-badge { position: absolute; top: 8px; right: 8px; background: #ff0000; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
      .pf-ig-badge { position: absolute; top: 8px; left: 8px; background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
      .pf-fb-badge { position: absolute; top: 8px; left: 42px; background: #1877f2; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
      .pf-th-badge { position: absolute; top: 8px; left: 76px; background: #000; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
      .pf-motion-badge { position: absolute; bottom: 8px; left: 8px; background: linear-gradient(120deg,#6b4cf0,#12a998); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
      .pf-ig-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: #dc2743; text-decoration: none; }
      .pf-fb-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: #1877f2; text-decoration: none; }
      .pf-th-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: #000; text-decoration: none; }
      .pf-num { display: inline-block; font-weight: 800; color: var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); padding: 0 6px; border-radius: 6px; margin-right: 2px; }
      /* 📊 성과 패널 */
      .yt-stats { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 18px; }
      .yt-stats-head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; margin-bottom: 14px; letter-spacing: -.3px; }
      .yt-kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
      .yt-kpi { flex: 1; min-width: 110px; background: linear-gradient(135deg, rgba(18,169,152,.12), rgba(107,76,240,.12)); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
      .yt-kpi .num { font-size: 26px; font-weight: 900; background: linear-gradient(135deg,var(--teal),var(--purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
      .yt-kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
      .yt-sec-title { font-size: 12.5px; font-weight: 800; color: var(--muted); margin: 16px 0 9px; }
      .yt-top { display: flex; flex-direction: column; gap: 8px; }
      .yt-top-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: rgba(127,127,127,.07); border-radius: 11px; }
      .yt-rank { font-size: 15px; width: 26px; text-align: center; }
      .yt-top-title { flex: 1; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .yt-top-views { font-size: 13px; font-weight: 800; color: var(--teal); white-space: nowrap; }
      .yt-chips { display: flex; gap: 7px; flex-wrap: wrap; }
      .yt-chip { font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 20px; background: rgba(107,76,240,.1); border: 1px solid rgba(107,76,240,.25); }
      .yt-chip b { color: var(--purple); }
      .pf-stage-stats { display: flex; gap: 16px; margin-top: 10px; }
      .pf-stat b { font-size: 15px; font-weight: 900; color: var(--text); }
      .pf-stat span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
      .pf-thumb-card figcaption { padding: 10px 12px 14px; }
      .pf-thumb-card h3 { font-size: 13px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      /* 큰 미리보기 스테이지 */
      .pf-stage { display: flex; gap: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 18px; }
      .pf-stage-video { width: 42%; max-width: 300px; aspect-ratio: 9/16; border-radius: 12px; background: #000; flex-shrink: 0; object-fit: cover; }
      .pf-stage-video.land { width: 60%; max-width: 520px; aspect-ratio: 16/9; } /* 롱폼=가로 큰 미리보기 */
      .pf-stage-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .pf-stage-meta select { margin-bottom: 14px; }
      .pf-stage-title { font-size: 18px; font-weight: 800; margin: 8px 0; }
      .pf-dl { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1.5px solid var(--line); color: var(--text); border-radius: 11px; padding: 9px 14px; font-size: 12.5px; font-weight: 800; cursor: pointer; text-decoration: none; transition: transform .15s ease, border-color .15s ease, color .15s ease; }
      .pf-dl:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-2px); }
      .pf-thumb-card.sel { outline: 2px solid var(--teal); outline-offset: 1px; }
      /* 데스크탑(>960px) 아래선 2단이 좁게 끼이므로 세로 스택(영상 위·메타 아래) — 태블릿 포함 */
      @media (max-width: 960px) {
        .pf-stage { flex-direction: column; padding: 16px; align-items: center; }
        .pf-stage-video { width: 100%; max-width: 260px; margin: 0 auto; }
        .pf-stage-video.land { max-width: 100%; } /* 가로(롱폼) 미리보기는 꽉 차게 */
        .pf-stage-meta { width: 100%; text-align: center; }
        .pf-stage-meta .pf-actions { justify-content: center; }
      }
      @media (max-width: 640px) {
        .pf-stage { padding: 14px; }
        .pf-stage-video { max-width: 220px; }
      }
      .mypf-count { font-weight: 700; color: var(--teal); }
      /* 작업내역 분리 필터(전체/영상/카드) */
      /* ★필터 바 — 가로 스크롤(밖으로 삐져나와 보임) 버리고 flex-wrap으로 박스 안에 가둔다.
         한 줄에 다 안 들어가면 아래 줄로 접힐 뿐, 구조적으로 박스 밖으로 나가는 게 불가능(테리 "하이라이트 밖으로 나온다" 근본해결). */
      .pf-filter { display: flex; flex-wrap: wrap; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 5px; margin: 6px 0 16px; max-width: 100%; box-sizing: border-box; }
      .pf-filter button { flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: var(--muted); font-weight: 800; font-size: 13px; padding: 8px 8px; border-radius: 999px; cursor: pointer; transition: all .15s ease; white-space: nowrap; }
      .pf-filter button.on { background: linear-gradient(135deg, var(--teal), var(--purple)); color: #fff; box-shadow: 0 3px 12px rgba(107,76,240,.3); }
      @media (max-width: 480px) { .pf-filter button { font-size: 12px; padding: 8px 6px; } }
      /* 카드 게시물(캐러셀) 미리보기 */
      .pf-stage-cards { width: 42%; max-width: 300px; flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 12px; -webkit-overflow-scrolling: touch; }
      .pf-stage-cards img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 10px; flex: 0 0 100%; scroll-snap-align: center; background: #000; }
      .pf-thumb.post { aspect-ratio: 4/5; }
      .pf-thumb.post img { width: 100%; height: 100%; object-fit: cover; }
      .pf-card-count { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
      @media (max-width: 960px) { .pf-stage-cards { width: 100%; max-width: 260px; margin: 0 auto; } }
      @media (max-width: 640px) { .pf-stage-cards { max-width: 220px; } }
      @media (max-width: 640px) {
        /* 포트폴리오가 많아도 세로로 안 길어지게 — 가로 스크롤 캐러셀(옆으로 넘겨 봄) */
        .mypf-grid { display: flex; grid-template-columns: none; overflow-x: auto; gap: 10px; padding-bottom: 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
        .mypf-grid > .pf-card { flex: 0 0 44%; scroll-snap-align: start; }
        .mypf-grid .pf-card figcaption { padding: 10px; }
        .mypf-grid .pf-card h3 { font-size: 13px; }
        .mypf-grid .pf-voice-note, .mypf-grid .pf-clip { font-size: 11px; }
        /* 가로 스크롤 힌트 문구 */
        .portfolio .pf-sub::after { content: " · 옆으로 넘겨 보세요 →"; color: var(--teal); font-weight: 700; }
      }
      /* ── 카드에서 바로 올리기(보기 모드) ── 스테이지로 안 올라가도 그 자리서 발송 */
      .pf-card-ops { display: flex; gap: 6px; padding: 0 12px 12px; }
      .pf-card-ops button { flex: 1 1 0; min-width: 0; border: none; border-radius: 9px; padding: 7px 4px; font-size: 12px; font-weight: 800; color: #fff; cursor: pointer; white-space: nowrap; transition: filter .15s ease, transform .15s ease; }
      .pf-card-ops button:hover { filter: brightness(1.08); transform: translateY(-1px); }
      .pf-card-ops button:disabled { opacity: .55; cursor: default; transform: none; }
      .pf-card-ops .op-fb { background: #1877f2; }
      .pf-card-ops .op-ig { background: linear-gradient(45deg,#f09433,#dc2743,#bc1888); }
      .pf-card-ops .op-yt { background: linear-gradient(135deg,#ff3b3b,#cc0000); }
      .pf-card-ops .op-th { background: linear-gradient(135deg,#333,#000); }
      /* ── 여러 개 선택(선택 모드) ── 보기 모드와 색·구조로 확실히 구분 ── */
      .selbar { position: sticky; top: 8px; z-index: 20; display: none; align-items: center; flex-wrap: wrap; gap: 8px 10px;
        background: linear-gradient(135deg, var(--teal), var(--purple)); color: #fff; border: 2px solid rgba(255,255,255,.35);
        border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; box-shadow: 0 8px 24px rgba(107,76,240,.34); }
      .selbar.on { display: flex; }
      .selbar .sb-count { font-weight: 900; font-size: 14px; }
      .selbar .sb-spacer { flex: 1 1 auto; }
      .selbar button { border: none; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
      .selbar .sb-ghost { background: rgba(255,255,255,.22); color: #fff; }
      .selbar .sb-ghost:hover { background: rgba(255,255,255,.34); }
      .selbar .sb-send { background: #fff; color: #1a1a2e; }
      .selbar .sb-send:disabled { opacity: .5; cursor: default; }
      .selbar .sb-prog { width: 100%; font-size: 12.5px; font-weight: 700; margin-top: 2px; }
      .sel-toggle.on { background: linear-gradient(135deg, var(--teal), var(--purple)); color: #fff; border-color: transparent; }
      .mypf-grid.selmode .pf-card-ops { display: none; }      /* 선택 모드엔 개별 올리기 숨김(헷갈림 방지) */
      .mypf-grid.selmode .pf-thumb-card { cursor: pointer; }
      .pf-check { display: none; position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
        background: rgba(0,0,0,.5); border: 2px solid #fff; z-index: 4; align-items: center; justify-content: center; color: rgba(255,255,255,.55); font-weight: 900; font-size: 15px; }
      .mypf-grid.selmode .pf-thumb-card .pf-check { display: flex; }
      .pf-thumb-card.picked { outline: 3px solid var(--teal); outline-offset: 1px; border-radius: 16px; }
      .pf-thumb-card.picked .pf-check { background: var(--teal); color: #fff; border-color: #fff; }
      /* 업로드 대상 계정 선택(멀티계정) */
      .acct-pick-box { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px; max-height: 220px; overflow-y: auto; }
      .acct-pick { display: flex; align-items: center; gap: 8px; background: var(--card2, rgba(127,127,127,.08)); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; font-weight: 700; font-size: 13.5px; }
      .acct-pick input { width: 18px; height: 18px; accent-color: var(--teal); }
      /* 로딩 팝업(업로드 준비·진행) — 버튼 위 글자 대신 보기 좋은 중앙 팝업 */
      .load-pop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 70; }
      .load-pop-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 30px; display: flex; align-items: center; gap: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.4); font-weight: 800; font-size: 14.5px; color: var(--text); max-width: 86%; }
      .load-spin { width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: loadspin .8s linear infinite; flex-shrink: 0; }
      @keyframes loadspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:8px">
        <div class="wordmark">On<span>Video</span></div>
        <span class="ver-badge"><span class="live-dot"></span><span id="ver">v–</span></span>
      </div>
      <div style="display:flex; gap:8px; align-items:center">
        <button id="theme-btn" class="ghost-btn small" title="밝게/어둡게">🌙</button>
      </div>
    </header>

    <nav class="topnav">
      <a href="/app" class="navtab">✏️ 영상 만들기</a>
      <a href="/create" class="navtab">✍️ 창작</a>
      <a href="/voices?tab=voice" class="navtab" id="nav-voice">🎙 목소리 듣기</a>
      <a href="/voices?tab=pf" class="navtab" id="nav-pf">🎬 포트폴리오</a>
      <a href="/monetize" class="navtab">💰 수익화 가이드</a>
    </nav>

    <main class="wrap wide">
      <p class="eyebrow">VOICE GUIDE</p>
      <h1 class="hero">목소리 듣고 고르기</h1>
      <p class="sub">재생 버튼을 눌러 직접 들어보세요. 콘텐츠에 맞는 목소리를 쓰면 시청 시간이 확 늘어납니다.</p>

      <!-- pane: 포트폴리오(오늘의 활동 + 포폴 + 성과) -->
      <div id="pane-pf" hidden>
      <!-- 📊 오늘의 활동: 제작·유튜브·인스타 각각 분리(한국시간) -->
      <div id="today-activity" class="yt-stats" hidden></div>

      <!-- 포트폴리오: 드롭다운 선택 + 큰 미리보기 + 썸네일 목록 -->
      <section class="portfolio" id="my-videos" hidden>
        <div class="portfolio-head">
          <h2 class="pf-title">🎬 포트폴리오 <span id="mypf-count" class="mypf-count"></span></h2>
          <p class="pf-sub">고르면 아래에서 크게 보고, 유튜브·인스타에 올리거나 내려받을 수 있어요.</p>
        </div>

        <!-- 작업내역 분리 필터(영상 / 카드 / 유튜브 하이라이트) -->
        <div class="pf-filter" id="pf-filter" role="tablist">
          <button data-media="all" class="on">전체</button>
          <button data-media="video">영상</button>
          <button data-media="create">창작</button>
          <button data-media="remake">재창작</button>
          <button data-media="card">카드</button>
          <button data-media="highlight">하이라이트</button>
        </div>
        <!-- 포폴 검색(제목) — 많아지면 찾기 쉽게 -->
        <div style="margin:0 0 14px"><input id="pf-search" class="input" type="search" placeholder="🔍 제목으로 검색" style="width:100%"></div>

        <!-- 📊 성과(올린 영상의 조회수·반응 집계) -->
        <div id="yt-stats" class="yt-stats" hidden></div>
        <div id="ig-stats" class="yt-stats" hidden></div>
        <div id="fb-stats" class="yt-stats" hidden></div>

        <!-- 큰 미리보기 플레이어 + 액션 -->
        <div class="pf-stage">
          <video id="pf-stage-video" class="pf-stage-video" controls playsinline preload="metadata"></video>
          <div id="pf-stage-cards" class="pf-stage-cards" hidden></div>
          <div class="pf-stage-meta">
            <select id="pf-select" class="input" aria-label="작업 선택"></select>
            <div id="pf-stage-info"></div>
          </div>
        </div>

        <!-- 여러 개 한 번에 올리기(벌크) — 보기 모드 ↔ 선택 모드 전환 -->
        <div style="display:flex; justify-content:flex-end; margin:0 0 10px">
          <button id="sel-toggle" class="ghost-btn small sel-toggle">☑ 여러 개 선택</button>
        </div>
        <div id="selbar" class="selbar">
          <span class="sb-count" id="sb-count">0개 선택</span>
          <button class="sb-ghost" id="sb-all">전체 선택</button>
          <button class="sb-ghost" id="sb-none">해제</button>
          <span class="sb-spacer"></span>
          <button class="sb-send" data-bulk="fb" disabled>👍 페북</button>
          <button class="sb-send" data-bulk="ig" disabled>📷 인스타</button>
          <button class="sb-send" data-bulk="th" disabled>🧵 스레드</button>
          <button class="sb-send" data-bulk="yt" disabled>▶ 유튜브</button>
          <div class="sb-prog" id="sb-prog" hidden></div>
        </div>

        <!-- 썸네일 목록(탭하면 위 플레이어에서 재생) -->
        <div id="mypf-grid" class="mypf-grid"></div>
        <div style="text-align:center; margin-top:18px"><button id="mypf-more" class="ghost-btn" hidden>더 보기</button></div>
      </section>
      </div><!-- /pane-pf -->

      <!-- pane: 목소리 듣기 -->
      <div id="pane-voice">
      <h2 class="pf-title">🔊 전체 목소리 미리듣기</h2>
      <div id="groups" class="voice-groups"></div>
      </div><!-- /pane-voice -->
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      // 이미지·영상 롱프레스/우클릭 메뉴(공유·저장) 차단
      document.addEventListener('contextmenu', (e) => { if (e.target && /^(IMG|VIDEO)$/.test(e.target.tagName)) e.preventDefault(); });
      // 다크/라이트 토글 (index와 lvm-theme 공유, 기본 라이트)
      function applyTheme(t) {
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        const b = $('theme-btn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
      }
      applyTheme(localStorage.getItem('lvm-theme') || 'light');
      $('theme-btn')?.addEventListener('click', () => {
        const next = (localStorage.getItem('lvm-theme') || 'light') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lvm-theme', next); applyTheme(next);
      });
      fetch('/api/version').then(r => r.json()).then(d => { const v = $('ver'); if (v) v.textContent = 'v' + (d.version || '?'); }).catch(() => {});
      const USE_LABEL = {
        issue: { t: '📰 이슈·미스터리·경고', d: '무게감과 긴장감으로 몰입시켜야 할 때' },
        info: { t: '💡 정보·건강·상식', d: '차분하고 신뢰가는 설명이 필요할 때' },
        sell: { t: '🛍️ 판매·리뷰·홍보', d: '밝고 에너지 있게 구매를 자극할 때' },
        heal: { t: '🌿 힐링·음식·여행', d: '따뜻하고 감성적인 분위기가 필요할 때' },
        anime: { t: '🎨 애니·동화·키즈', d: '밝고 명랑한 톤 · 아이가 봐도 재밌는 애니메이션 영상에' },
      };
      let curAudio = null, curCard = null;

      let VOICE_LIST = []; // 수정 모달의 목소리 선택용(id·label)
      async function load() {
        const d = await (await fetch('/api/categories')).json();
        VOICE_LIST = d.voices || [];
        const groups = {};
        for (const v of d.voices) {
          // 첫 용도를 대표 그룹으로
          const g = v.use[0];
          (groups[g] = groups[g] || []).push(v);
        }
        const wrap = $('groups');
        wrap.innerHTML = '';
        for (const key of ['issue', 'info', 'sell', 'heal', 'anime']) {
          if (!groups[key]) continue;
          const box = document.createElement('div');
          box.className = 'vgroup';
          box.innerHTML = `<div class="vg-title">${USE_LABEL[key].t}</div><div class="vg-desc">${USE_LABEL[key].d}</div>`;
          for (const v of groups[key]) {
            const card = document.createElement('div');
            card.className = 'vcard';
            card.innerHTML = `
              <button class="play" data-voice="${v.id}">▶</button>
              <div class="vmeta">
                <div><span class="vname">${v.label}</span><span class="vgender">${v.gender}</span></div>
                <div class="vtip">${v.tip}</div>
              </div>`;
            box.appendChild(card);
          }
          wrap.appendChild(box);
        }
        document.querySelectorAll('.play').forEach((btn) => (btn.onclick = () => play(btn)));
      }

      async function play(btn) {
        const voice = btn.dataset.voice;
        const card = btn.closest('.vcard');
        if (curAudio) { curAudio.pause(); curAudio = null; }
        if (curCard) curCard.classList.remove('playing');
        btn.classList.add('loading');
        btn.textContent = '…';
        try {
          const r = await fetch('/api/voice-preview?voice=' + encodeURIComponent(voice));
          if (!r.ok) throw new Error((await r.json()).error || '실패');
          const url = URL.createObjectURL(await r.blob());
          curAudio = new Audio(url);
          curCard = card;
          card.classList.add('playing');
          curAudio.onended = () => { card.classList.remove('playing'); btn.textContent = '▶'; };
          await curAudio.play();
          btn.textContent = '❚❚';
        } catch (e) {
          alert(e.message);
          btn.textContent = '▶';
        }
        btn.classList.remove('loading');
      }
      load();

      // ── 포트폴리오: 드롭다운 선택 + 큰 미리보기 ──
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const BADGE = { issue:'📰', info:'💡', sell:'🛍️', heal:'🌿', anime:'🎨' };
      let allItems = [], myItems = [], myShown = 0, canDelete = false, curIdx = 0, mediaFilter = 'all';
      let selMode = false, picked = new Set(), bulkBusy = false; // 여러 개 선택(벌크 업로드) 상태
      const PAGE = 12;
      const isCard = it => it.media === 'card' || it.media === 'card-post';
      const isHighlight = it => it.media === 'highlight'; // 유튜브 하이라이트(별도 보관)
      const isCreate = it => it.origin === 'create'; // ✍️ 창작
      const isRemake = it => it.origin === 'remake'; // 🎭 재창작
      // 순수 영상(영상 만들기) = video인데 창작·재창작 아님(이원화).
      const isVideo = it => (it.media === 'video' || !it.media) && !isCreate(it) && !isRemake(it);
      async function loadMyVideos(keepIdx) {
        try {
          const a = await (await fetch('/api/auth')).json();
          canDelete = !a.required || a.ok;
          const d = await (await fetch('/api/portfolio')).json();
          allItems = Array.isArray(d.items) ? d.items : [];
        } catch { allItems = []; }
        // 과거부터 순번(제일 오래된 작업물=1번). createdAt 있는 내 작업물만 오름차순으로 번호 매김.
        allItems.slice().filter(it => it.createdAt).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)).forEach((it, i) => { it.num = i + 1; });
        applyFilter(keepIdx);
      }
      // 작업내역 분리: 영상/카드 필터 적용 후 드롭다운·그리드·스테이지 갱신.
      function applyFilter(keepIdx) {
        const sec = $('my-videos');
        if (!allItems.length) { sec.hidden = true; return; }
        sec.hidden = false;
        const nV = allItems.filter(isVideo).length, nC = allItems.filter(isCard).length, nH = allItems.filter(isHighlight).length;
        const nCr = allItems.filter(isCreate).length, nRm = allItems.filter(isRemake).length;
        $('mypf-count').textContent = `(영상 ${nV}${nCr ? ` · 창작 ${nCr}` : ''}${nRm ? ` · 재창작 ${nRm}` : ''} · 카드 ${nC}${nH ? ` · 하이라이트 ${nH}` : ''})`;
        myItems = allItems.filter(it => mediaFilter === 'all' ? true
          : mediaFilter === 'card' ? isCard(it)
          : mediaFilter === 'highlight' ? isHighlight(it)
          : mediaFilter === 'create' ? isCreate(it)
          : mediaFilter === 'remake' ? isRemake(it)
          : isVideo(it));
        // 제목 검색(포폴 많아지면 찾기 쉽게) — 공백 무시 부분일치.
        const q = (($('pf-search') && $('pf-search').value) || '').trim().toLowerCase().replace(/\s+/g, '');
        if (q) myItems = myItems.filter(it => String(it.title || '').toLowerCase().replace(/\s+/g, '').includes(q));
        if (!myItems.length) {
          $('pf-select').innerHTML = '';
          $('mypf-grid').innerHTML = '<p class="pf-sub" style="padding:24px 4px">이 분류엔 아직 없어요.</p>';
          $('pf-stage-info').innerHTML = ''; $('pf-stage-video').hidden = true; $('pf-stage-cards').hidden = true;
          $('mypf-more').hidden = true;
          return;
        }
        $('pf-select').innerHTML = myItems.map((it, i) =>
          `<option value="${i}">${it.kind === 'sample' ? '🔹 ' : (it.media === 'card-post' ? '🎴 ' : it.media === 'card' ? '🎞 ' : '')}${it.num ? '#' + it.num + ' ' : ''}${esc(it.title)} — ${esc(it.voice)}</option>`).join('');
        myShown = 0; $('mypf-grid').innerHTML = ''; showMore();
        curIdx = Math.min(keepIdx ?? 0, myItems.length - 1);
        $('pf-select').value = curIdx;
        selectVideo(curIdx, false);
      }
      $('pf-filter').onclick = e => {
        const b = e.target.closest('[data-media]'); if (!b) return;
        mediaFilter = b.dataset.media;
        [...$('pf-filter').children].forEach(c => c.classList.toggle('on', c === b));
        applyFilter(0);
      };
      // 제목 검색 — 입력할 때마다 필터(가벼운 디바운스).
      let pfSearchT = null;
      $('pf-search') && $('pf-search').addEventListener('input', () => { clearTimeout(pfSearchT); pfSearchT = setTimeout(() => applyFilter(0), 200); });
      function showMore() {
        const grid = $('mypf-grid');
        for (let i = myShown; i < Math.min(myShown + PAGE, myItems.length); i++) {
          const it = myItems[i];
          const isPost = it.media === 'card-post';
          const fig = document.createElement('figure');
          fig.className = 'pf-card pf-thumb-card';
          fig.dataset.idx = i;
          fig.dataset.id = it.id;
          fig.dataset.post = isPost ? '1' : '';
          fig.dataset.land = it.orientation === 'landscape' ? '1' : '';
          const thumbBox = isPost
            ? `<div class="pf-thumb post"><img src="${esc(it.thumb || (it.images && it.images[0]) || '')}" alt="" loading="lazy">${(it.images && it.images.length) ? `<span class="pf-card-count">🎴 ${it.images.length}장</span>` : ''}${it.instagramUrl ? '<span class="pf-ig-badge">IG</span>' : ''}${it.facebookUrl ? '<span class="pf-fb-badge">FB</span>' : ''}${it.threadsUrl ? '<span class="pf-th-badge">TH</span>' : ''}</div>`
            : `<div class="pf-thumb${it.orientation === 'landscape' ? ' land' : ''}"><video ${it.thumb ? `poster="${it.thumb}"` : ''} src="${it.video}#t=0.5" playsinline preload="metadata" muted></video><span class="pf-play">▶</span>${it.motion ? '<span class="pf-motion-badge">🎬 영상</span>' : ''}${it.youtubeUrl ? '<span class="pf-yt-badge">YT</span>' : ''}${it.instagramUrl ? '<span class="pf-ig-badge">IG</span>' : ''}${it.facebookUrl ? '<span class="pf-fb-badge">FB</span>' : ''}${it.threadsUrl ? '<span class="pf-th-badge">TH</span>' : ''}</div>`;
          const madeTxt = it.createdAt ? new Date(it.createdAt).toLocaleDateString('ko-KR', {year: 'numeric', month: 'long', day: 'numeric'}) : '';
          fig.innerHTML = `${thumbBox}
            <figcaption><span class="pf-badge ${esc(it.goal)}">${BADGE[it.goal] || '🎬'} ${esc(it.category)}</span><h3>${it.num ? `<span class="pf-num">#${it.num}</span> ` : ''}${esc(it.title)}</h3>${madeTxt ? `<p class="pf-made">📅 ${esc(madeTxt)} 제작</p>` : ''}</figcaption>`;
          grid.appendChild(fig);
          // 선택 모드용 체크 표시(썸네일 위 모서리) + 보기 모드용 '바로 올리기' 버튼.
          const tb = fig.querySelector('.pf-thumb');
          if (tb) tb.insertAdjacentHTML('beforeend', '<span class="pf-check">✓</span>');
          const ops = isPost
            ? `<button class="op-fb" data-op="fb">👍 페북</button><button class="op-ig" data-op="ig">📷 인스타</button>`
            : `<button class="op-fb" data-op="fb">👍</button><button class="op-ig" data-op="ig">📷</button><button class="op-th" data-op="th">🧵</button><button class="op-yt" data-op="yt">▶</button>`;
          fig.insertAdjacentHTML('beforeend', `<div class="pf-card-ops">${ops}</div>`);
          if (selMode && picked.has(it.id)) fig.classList.add('picked');
          if (!isPost) {
            // 썸네일 박스 비율도 실제 영상 비율 우선(저장된 orientation 틀려도 정확히 표시).
            const tv = fig.querySelector('.pf-thumb video'), tbox = fig.querySelector('.pf-thumb');
            tv.addEventListener('loadedmetadata', () => { if (tv.videoWidth && tv.videoHeight) tbox.classList.toggle('land', tv.videoWidth > tv.videoHeight); });
          }
        }
        myShown = Math.min(myShown + PAGE, myItems.length);
        $('mypf-more').hidden = myShown >= myItems.length;
      }
      // 드롭다운/썸네일 선택 → 위 큰 플레이어에 로드 + 액션 렌더
      function selectVideo(idx, doScroll) {
        const it = myItems[idx]; if (!it) return;
        curIdx = idx;
        const isPost = it.media === 'card-post';
        const v = $('pf-stage-video'), cc = $('pf-stage-cards');
        if (isPost) {
          // 카드 게시물 = 이미지 캐러셀(영상 플레이어 숨김).
          v.hidden = true; v.removeAttribute('src');
          cc.hidden = false;
          cc.innerHTML = (it.images || []).map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join('');
        } else {
          cc.hidden = true; cc.innerHTML = '';
          v.hidden = false;
          v.src = it.video; if (it.thumb) v.poster = it.thumb; else v.removeAttribute('poster');
          v.classList.toggle('land', it.orientation === 'landscape');
          v.onloadedmetadata = () => { if (v.videoWidth && v.videoHeight) v.classList.toggle('land', v.videoWidth > v.videoHeight); };
        }
        $('pf-select').value = idx;
        const canDel = canDelete && it.kind === 'mine';
        const createdTxt = it.createdAt ? esc(new Date(it.createdAt).toLocaleString('ko-KR')) : (isPost ? '카드 게시물' : '샘플 영상');
        const actions = isPost
          ? `<button class="pf-zoom">🔍 크게 보기</button>
             <button class="pf-ig" data-id="${esc(it.id)}">📷 인스타 캐러셀 올리기</button>
             <button class="pf-fb" data-id="${esc(it.id)}">👍 페북 올리기</button>
             ${canDel ? `<button class="pf-del" data-id="${esc(it.id)}">🗑 삭제</button>` : ''}`
          : `<button class="pf-zoom">🔍 크게 보기</button>
             <button class="pf-yt" data-id="${esc(it.id)}">📺 유튜브 올리기</button>
             <button class="pf-ig" data-id="${esc(it.id)}">📷 인스타 올리기</button>
             <button class="pf-fb" data-id="${esc(it.id)}">👍 페북 올리기</button>
             <button class="pf-th" data-id="${esc(it.id)}">🧵 스레드 올리기</button>
             <a class="pf-dl" href="${it.video}" download="${esc(it.title)}.mp4">⬇ 다운로드</a>
             ${canDel ? `<button class="pf-edit" data-id="${esc(it.id)}">✏️ 수정</button>` : ''}
             ${canDel ? `<button class="pf-del" data-id="${esc(it.id)}">🗑 삭제</button>` : ''}`;
        $('pf-stage-info').innerHTML = `
          <span class="pf-badge ${esc(it.goal)}">${BADGE[it.goal] || '🎬'} ${esc(it.category)}</span>
          <h3 class="pf-stage-title">${it.num ? `<span class="pf-num">#${it.num}</span> ` : ''}${esc(it.title)}${canDel ? ` <button class="pf-edit-title" data-id="${esc(it.id)}" title="제목 수정" style="border:none;background:none;cursor:pointer;font-size:16px;vertical-align:middle">✏️</button>` : ''}</h3>
          <p class="pf-voice-note">${isPost ? '🎴 ' + ((it.images || []).length) + '장 카드뉴스' : '🎙 ' + esc(it.voice)}</p>
          <p class="pf-clip">${createdTxt}</p>
          ${(() => { const st = (window.__ytStats || {})[it.id]; return st && (st.views || st.likes || st.comments || st.shares) ? `<div class="pf-stage-stats"><div class="pf-stat"><b>${fmtNum(st.views)}</b><span>조회수</span></div><div class="pf-stat"><b>${fmtNum(st.likes)}</b><span>좋아요</span></div><div class="pf-stat"><b>${fmtNum(st.comments)}</b><span>댓글</span></div>${st.shares ? `<div class="pf-stat"><b>${fmtNum(st.shares)}</b><span>공유</span></div>` : ''}</div>` : ''; })()}
          ${it.youtubeUrl ? `<a class="pf-yt-link" href="${esc(it.youtubeUrl)}" target="_blank">▶ 유튜브에서 보기</a>` : ''}
          ${it.instagramUrl ? `<a class="pf-ig-link" href="${esc(it.instagramUrl)}" target="_blank">▶ 인스타에서 보기</a>` : ''}
          ${it.facebookUrl ? `<a class="pf-fb-link" href="${esc(it.facebookUrl)}" target="_blank">▶ 페이스북에서 보기</a>` : ''}
          ${it.threadsUrl ? `<a class="pf-th-link" href="${esc(it.threadsUrl)}" target="_blank">▶ 스레드에서 보기</a>` : ''}
          <div class="pf-actions">${actions}</div>`;
        document.querySelectorAll('.pf-thumb-card').forEach(c => c.classList.toggle('sel', Number(c.dataset.idx) === idx));
        if (doScroll) $('my-videos').scrollIntoView({behavior:'smooth', block:'start'});
      }
      $('mypf-more').onclick = showMore;
      $('pf-select').onchange = e => selectVideo(Number(e.target.value), false);
      $('mypf-grid').onclick = e => {
        const card = e.target.closest('.pf-thumb-card');
        if (!card) return;
        // 보기 모드: 카드 아래 미니버튼 = 그 자리서 바로 올리기(스테이지 안 올라감).
        const op = e.target.closest('[data-op]');
        if (op && !selMode) {
          op.dataset.id = card.dataset.id;               // uploadToX 는 btn.dataset.id 를 씀
          const isPost = card.dataset.post === '1', isLand = card.dataset.land === '1';
          if (op.dataset.op === 'fb') uploadToFacebook(op, isPost);
          else if (op.dataset.op === 'ig') uploadToInstagram(op, isPost, isLand);
          else if (op.dataset.op === 'th') uploadToThreads(op, isPost);
          else if (op.dataset.op === 'yt') uploadToYouTube(op);
          return;
        }
        // 선택 모드: 카드 클릭 = 선택 토글(스테이지 안 뜸).
        if (selMode) { togglePick(card.dataset.id, card); return; }
        // 보기 모드 기본: 스테이지에 로드.
        selectVideo(Number(card.dataset.idx), true);
      };

      // ── 여러 개 선택(벌크 업로드) ──
      function updateSelCount() {
        const n = picked.size;
        if ($('sb-count')) $('sb-count').textContent = n + '개 선택';

        let st; try { st = await (await fetch(statusUrl)).json(); } catch { st = {}; }

      // 반환 = permalink/url(배지용) 또는 ''(링크 없음). 실패 시 throw.
      async function bulkUploadOne(plat, it, accountId) {
        const id = it.id;

          const d = await r.json(); if (!r.ok) throw new Error(d.error || '업로드 실패'); return d.url || '';
        }
        // 캡션(인스타·페북 공용 생성기)

        const caption = cap.caption || '';
        if (plat === 'fb') {
          const url = (isPost ? '/api/facebook/upload-photos/' : '/api/facebook/upload/') + encodeURIComponent(id);

        }
        if (plat === 'th') {
          const r = await fetch('/api/threads/upload/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption, accountId }) });
          const d = await r.json(); if (!r.ok) throw new Error(d.error || '업로드 실패'); return d.permalink || '';
        }
        // ig
        const url = isPost ? '/api/instagram/upload-carousel/' + encodeURIComponent(id) : '/api/instagram/upload/' + encodeURIComponent(id);
        const body = isPost ? { caption, accountId } : { kind: isLand ? 'feed' : 'reels', caption, accountId };
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

      function openVideoModal(it) {

      // ── 포트폴리오 편집(후킹·나레이션 직접 수정 + 재렌더) — 인물 틀림 등 바로 고쳐 다시 만들기 ──

        // AI가 영상 보고 나레이션 작성

      // 재렌더 로그 → 진행률(수정 전용 에너지바). 단계별 가중치 + [빠른렌더] N%.
      function editEnergy(box, line) {

        else if (/썸네일/.test(line)) set(Math.max(cur(), 92), '🖼 썸네일 만드는 중…');
        else set(Math.max(cur() + 1, 10), '다시 만드는 중…');
      }
      function celebratePf() {

        c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
        const colors = ['#12a998','#7c5cff','#ff8abf','#ffd84d','#4fe0d0'];
        for (let i = 0; i < 80; i++) {
          const p = document.createElement('div');
          const sz = 6 + Math.random() * 8;
          p.style.cssText = `position:absolute;top:-10px;left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};opacity:.95;transform:rotate(${Math.random()*360}deg);animation:pfFall ${1.4+Math.random()*1.4}s ${Math.random()*0.4}s ease-in forwards`;

      function applyUploadBadge(id, platform, url) {

      // ── 업로드 대상 계정 선택(멀티계정 공용) ──
      // 모달 안에 넣는 체크박스(계정 2개 이상일 때만). 1개면 빈 문자열 → 기본 계정 사용.
      function acctPickerHtml(accounts) {
        if (!accounts || !accounts.length) return ''; // 계정 없음(연결 전) → 생략
        const rows = accounts.map((a, i) => `<label class="acct-pick"><input type="checkbox" class="acct-cb" value="${esc(a.id)}" ${i === 0 ? 'checked' : ''}><span>${esc(a.label || a.username || a.pageName || a.channelTitle || a.id)}</span></label>`).join('');
        return `<div class="field-label">보낼 계정 (이름으로 체크 · 여러 개 가능)</div><div class="acct-pick-box">${rows}</div>`;
      }
      function pickedAcctIds(scope) {
        const cbs = [...scope.querySelectorAll('.acct-cb')];
        if (!cbs.length) return [undefined]; // 계정 1개(선택 UI 없음) → 기본
        const ids = cbs.filter(c => c.checked).map(c => c.value);
        return ids; // 빈 배열이면 호출부에서 "계정 선택하세요" 처리
      }
      // 벌크용: 계정 선택 팝업(2개 이상일 때). 1개면 바로 그 계정. 반환 = id 배열 또는 null(취소).
      function pickAccounts(accounts) {
        return new Promise(resolve => {
          if (!accounts || !accounts.length) { resolve([undefined]); return; } // 계정 없음 → 기본
          const box = document.createElement('div'); box.className = 'load-pop';
          const rows = accounts.map(a => `<label class="acct-pick"><input type="checkbox" class="acct-cb" value="${esc(a.id)}" checked><span>${esc(a.label || a.username || a.pageName || a.channelTitle || a.id)}</span></label>`).join('');
          box.innerHTML = `<div class="modal-box" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto">

      async function uploadToThreads(btn, isPost) {
        const id = btn.dataset.id;
        if (isPost) { alert('스레드는 아직 영상만 올릴 수 있어요(카드 게시물 제외).'); return; }
        if (btn.disabled) return; btn.disabled = true;
        showLoading('🧵 스레드 준비 중…');
        try {
          const st = await (await fetch('/api/threads/status')).json();
          if (!st.connected) { hideLoading(); alert('먼저 영상 만들기 화면의 ⚙ 키 설정에서 스레드 계정을 연결하세요.'); btn.disabled = false; return; }
          setLoading('🧵 글 만드는 중…');
          // 캡션은 인스타 캡션 생성기를 공용 재사용(스레드는 500자 제한 — 서버에서 자동으로 맞춰 자름).
          const r = await fetch('/api/instagram/caption/' + encodeURIComponent(id));
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || '글 생성 실패');
          hideLoading();
          openThPfModal(id, d.caption || '', st.accounts || []);
        } catch (e) { hideLoading(); alert(e.message); }
        finally { btn.disabled = false; }
      }
      function openThPfModal(id, caption, accounts) {
        let box = $('th-modal');
        if (!box) { box = document.createElement('div'); box.id = 'th-modal'; box.className = 'modal'; document.body.appendChild(box); }
        box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50';
        box.innerHTML = `<div class="modal-box" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto">
          <div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2>🧵 스레드 올리기</h2><button class="ghost-btn" data-th="close">✕</button></div>
          <p class="sub small">글은 500자까지 올라가요(넘으면 자동으로 잘려요). 링크를 넣으면 글 아래 미리보기로 붙어요 — 쇼핑·제휴 링크에 좋아요.</p>
          ${acctPickerHtml(accounts)}
          <label class="field-label">글 내용<textarea id="th-caption" class="input" rows="7" maxlength="500">${esc((caption || '').slice(0, 500))}</textarea></label>
          <label class="field-label">첨부 링크(선택)<input id="th-link" class="input" placeholder="예: https://partner.yuanfnb.com/r/XXXX" /></label>
          <button class="primary-btn" data-th="upload">스레드에 올리기</button>
          <p id="th-up-msg" class="mini-state">영상 처리 때문에 30초~1분 걸릴 수 있어요.</p>
        </div>`;
        box.onclick = async e => {
          const act = e.target.closest('[data-th]')?.dataset.th;
          if (act === 'close' || e.target === box) { box.remove(); return; }
          if (act === 'upload') {
            const accIds = pickedAcctIds(box);
            if (!accIds.length) { $('th-up-msg').textContent = '보낼 계정을 하나 이상 선택하세요.'; return; }
            const up = e.target; up.disabled = true;
            const cap = $('th-caption').value, link = $('th-link').value.trim();
            let ok = 0, fail = 0, perma = '', lastErr = '';
            for (let i = 0; i < accIds.length; i++) {
              up.textContent = `올리는 중… ${i + 1}/${accIds.length}`;
              $('th-up-msg').textContent = '스레드가 영상을 받아 처리하는 중…';
              try {
                const r = await fetch('/api/threads/upload/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption: cap, link, accountId: accIds[i] }) });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || '업로드 실패');
                ok++; if (d.permalink) perma = d.permalink;
              } catch (err) { fail++; lastErr = (err && err.message) || '알 수 없는 오류'; console.warn('[스레드 실패]', accIds[i], lastErr); }
              if (i < accIds.length - 1) await new Promise(r => setTimeout(r, 1500));
            }
            if (ok) applyUploadBadge(id, 'th', perma);
            $('th-up-msg').innerHTML = (ok ? `✅ ${ok}개 계정 게시 완료!` + (fail ? ` · ❌ ${fail}개 실패` : '') : `❌ 전부 실패(${fail}개)`)
              + (!ok && lastErr ? `<br><span style="color:#d33">사유: ${esc(lastErr)}</span>` : '')
              + (perma ? `<br><a href="${perma}" target="_blank" style="display:inline-block;margin-top:8px;padding:10px 16px;background:#000;color:#fff;border-radius:8px;font-weight:800;text-decoration:none">▶ 스레드에서 열기</a>` : '');
            up.textContent = ok ? '완료 🎉' : '다시 시도'; up.disabled = ok > 0;
          }
        };
      }
      // ── 숫자 축약(1234→1.2천, 12345→1.2만) ──
      function fmtNum(n) {
        n = Number(n) || 0;
        if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + '만';
        if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + '천';
        return String(n);
      }
      // ── 📊 성과 패널 공용 렌더(유튜브/인스타) ──
      function renderPerf(boxId, d, title) {
        const box = $(boxId);
        if (!d.connected || !d.summary || !d.summary.total) { box.hidden = true; return; }
        const s = d.summary, medal = ['🥇', '🥈', '🥉'];
        const top = s.top3.map((it, i) => `<div class="yt-top-row"><span class="yt-rank">${medal[i] || ''}</span><span class="yt-top-title">${esc(it.title)}</span><span class="yt-top-views">${fmtNum(it.views)}회</span></div>`).join('');
        const voiceChips = (s.byVoice || []).filter(v => v.avg > 0).map(v => `<span class="yt-chip">🎙 ${esc(v.name)} <b>평균 ${fmtNum(v.avg)}</b></span>`).join('');
        const catChips = (s.byCategory || []).filter(c => c.avg > 0).map(c => `<span class="yt-chip">${esc(c.name)} <b>평균 ${fmtNum(c.avg)}</b></span>`).join('');
        box.hidden = false;
        box.innerHTML = `
          <div class="yt-stats-head">${title} <span style="font-size:12px;color:var(--muted);font-weight:600">· 올린 영상 ${s.total}개</span></div>
          <div class="yt-kpis">
            <div class="yt-kpi"><div class="num">${fmtNum(s.totalViews)}</div><div class="lbl">총 조회수</div></div>
            <div class="yt-kpi"><div class="num">${fmtNum(s.totalLikes)}</div><div class="lbl">총 좋아요</div></div>
            ${s.totalShares != null ? `<div class="yt-kpi"><div class="num">${fmtNum(s.totalShares)}</div><div class="lbl">총 공유수</div></div>` : ''}
            <div class="yt-kpi"><div class="num">${s.total}</div><div class="lbl">올린 영상</div></div>
          </div>
          <div class="yt-sec-title">🏆 조회수 TOP 3</div>
          <div class="yt-top">${top}</div>
          ${voiceChips ? `<div class="yt-sec-title">🎙 어떤 목소리가 먹히나 (평균)</div><div class="yt-chips">${voiceChips}</div>` : ''}
          ${catChips ? `<div class="yt-sec-title">📂 어떤 주제가 먹히나 (평균)</div><div class="yt-chips">${catChips}</div>` : ''}`;
      }
      async function loadYtStats() {
        try {
          const d = await (await fetch('/api/youtube/stats?t=' + Date.now(), {cache: 'no-store'})).json();
          window.__ytStats = {}; (d.items || []).forEach(it => { window.__ytStats[it.id] = it; });
          renderPerf('yt-stats', d, '📊 유튜브 성과');
          if (typeof curIdx === 'number' && myItems[curIdx]) selectVideo(curIdx, false);
        } catch (e) {}
      }
      async function loadIgStats() {
        try {
          const d = await (await fetch('/api/instagram/stats?t=' + Date.now(), {cache: 'no-store'})).json();
          renderPerf('ig-stats', d, '📷 인스타 성과');
        } catch (e) {}
      }
      async function loadFbStats() {
        try {
          const d = await (await fetch('/api/facebook/stats?t=' + Date.now(), {cache: 'no-store'})).json();
          renderPerf('fb-stats', d, '👍 페이스북 성과');
        } catch (e) {}
      }
      // ── 📊 오늘의 활동(제작·유튜브·인스타 각각) ──
      function fmtLast(x) {
        if (!x || !x.lastAt) return '없음';
        const d = new Date(x.lastAt);
        const hhmm = d.toLocaleTimeString('ko-KR', {timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit'});
        const mins = Math.floor((Date.now() - d.getTime()) / 60000);
        const ago = mins < 1 ? '방금' : mins < 60 ? mins + '분 전' : mins < 1440 ? Math.floor(mins / 60) + '시간 전' : Math.floor(mins / 1440) + '일 전';
        return hhmm + ' (' + ago + ')';
      }
      async function loadActivity() {
        const el = document.getElementById('today-activity'); if (!el) return;
        try {
          const a = await (await fetch('/api/activity/today')).json();
          const yt = a.youtube || {}, ig = a.instagram || {}, fb = a.facebook || {}, th = a.threads || {};
          const col = (emoji, label, x, isProduce, followLbl) => {
            const num = isProduce ? (a.produced || 0) : (x.error ? '–' : (x.today || 0));
            // 마지막 올린 시각 · 총 몇 개 올렸는지 · 팔로워/구독자 수(연결된 채널만)
            const lines = isProduce
              ? ['완성']
              : (x.error
                ? [esc(x.error)]
                : ['마지막 ' + fmtLast(x), '총 ' + (x.total || 0) + '개 올림', (x.followers != null ? '👥 ' + followLbl + ' ' + fmtNum(x.followers) : '')].filter(Boolean));
            const sub = lines.map(t => `<span style="display:block">${t}</span>`).join('');
            return `<div class="yt-kpi"><div class="num">${num}</div><div class="lbl">${emoji} ${label}<br><span style="font-size:11px;color:var(--muted);font-weight:600">${sub}</span></div></div>`;
          };
          el.hidden = false;
          el.innerHTML = `
            <div class="yt-stats-head">📊 오늘의 활동 <span style="font-size:12px;color:var(--muted);font-weight:600">· 한국시간 기준</span></div>
            <div class="yt-kpis">
              ${col('🎬', '제작', null, true)}
              ${col('▶️', '유튜브', yt, false, '구독자')}
              ${col('📷', '인스타', ig, false, '팔로워')}
              ${col('👍', '페이스북', fb, false, '팔로워')}
              ${col('🧵', '스레드', th, false, '팔로워')}
            </div>`;
        } catch (e) {}
      }
      // ── 상단 탭(목소리 듣기 / 포트폴리오) 전환 ──
      function applyVoicesTab(t) {
        const isPf = t === 'pf';
        if ($('pane-voice')) $('pane-voice').hidden = isPf;
        if ($('pane-pf')) $('pane-pf').hidden = !isPf;
        if ($('nav-voice')) $('nav-voice').classList.toggle('active', !isPf);
        if ($('nav-pf')) $('nav-pf').classList.toggle('active', isPf);
        const eb = document.querySelector('.eyebrow'), h = document.querySelector('.hero'), sb = document.querySelector('.sub');
        if (eb) eb.textContent = isPf ? 'MY PORTFOLIO' : 'VOICE GUIDE';
        if (h) h.textContent = isPf ? '내 포트폴리오' : '목소리 듣고 고르기';
        if (sb) sb.textContent = isPf
          ? '만든 영상을 보고, 유튜브·인스타에 올리고 성과를 확인하세요.'
          : '재생 버튼을 눌러 직접 들어보세요. 콘텐츠에 맞는 목소리를 쓰면 시청 시간이 확 늘어납니다.';
      }
      applyVoicesTab(new URLSearchParams(location.search).get('tab') || 'voice');

      loadMyVideos();
      loadYtStats();
      loadIgStats();
      loadFbStats();
      loadActivity();
      setInterval(loadActivity, 60000); // "N분 전" 실시간 갱신
    </script>
  </body>
</html>
