<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>뿌리오 방송콘솔 — 한 번에 사방으로 송출</title>
    <link rel="manifest" href="/ppurio-manifest.json" />
    <meta name="theme-color" content="#f3eee2" />
    <link rel="apple-touch-icon" href="/ppurio-assets/ppurio-icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
      :root {
        --bg:#efe8da; --card:#faf5ea; --ink:#231d13; --dim:#7a715c; --line:rgba(35,29,19,.1);
        --lime:#a8dc2e; --lime-d:#5c9a1d; --terra:#e0652f; --sun:#eaa828; --field:#fff;
        --sh:0 1px 2px rgba(35,29,19,.04), 0 12px 30px -16px rgba(35,29,19,.28);
      }
      [data-theme="dark"] {
        --bg:#201c15; --card:#2b261d; --ink:#f0ece1; --dim:#a79e8c; --line:rgba(255,255,255,.1);
        --lime:#b6e23a; --lime-d:#b6e23a; --terra:#ff7a45; --sun:#ffc23a; --field:#211d16;
        --sh:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.5);
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family:'Pretendard',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.5; transition:background .4s; min-height:100vh; }
      .fr { font-family:'Fraunces',serif; font-style:italic; }
      a { color:inherit; }

      header { position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg),transparent 12%); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
      .head { display:flex; align-items:center; gap:12px; margin:0 auto; padding:13px clamp(16px,4vw,28px); }
      .back { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:17px; display:grid; place-items:center; text-decoration:none; transition:transform .15s; }
      .back:hover { transform:translateX(-2px); }
      .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:-.02em; flex:1; }
      .brand img { width:34px; height:34px; object-fit:contain; }
      .brand small { font-weight:600; font-size:12px; color:var(--dim); margin-left:-2px; }
      #theme-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:18px; cursor:pointer; display:grid; place-items:center; transition:transform .2s; }
      #theme-btn:hover { transform:scale(1.08); }

      .wrap { width:100%; margin:0 auto; padding:clamp(18px,3vw,30px) clamp(16px,4vw,48px) 80px; }
      .work-grid { display:grid; grid-template-columns:1.55fr 1fr; gap:clamp(14px,1.6vw,22px); align-items:start; }
      .col-main, .col-side { display:flex; flex-direction:column; min-width:0; }
      @media (max-width:1000px){ .work-grid{ grid-template-columns:1fr; } }

      /* 환영 */
      .welcome { display:flex; align-items:center; gap:clamp(14px,3vw,26px); padding:clamp(16px,3vw,24px) clamp(20px,3vw,30px); background:linear-gradient(120deg, var(--card), color-mix(in srgb,var(--lime) 14%,var(--card))); border:1px solid var(--line); border-radius:24px; box-shadow:var(--sh); margin-bottom:22px; position:relative; overflow:hidden; }
      .welcome .wpic { width:clamp(64px,11vw,92px); flex-shrink:0; filter:drop-shadow(0 10px 16px rgba(35,29,19,.2)); animation:bob 4.5s ease-in-out infinite; }
      @keyframes bob { 50%{ transform:translateY(-8px) rotate(2deg);} }
      .welcome h1 { font-size:clamp(19px,3vw,28px); font-weight:900; letter-spacing:-.03em; line-height:1.15; }
      .welcome h1 .fr { color:var(--lime-d); }
      .welcome p { font-size:clamp(13px,1.6vw,15px); color:var(--dim); margin-top:5px; }

      .step-card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:clamp(16px,2.4vw,24px); margin-bottom:16px; box-shadow:var(--sh); }
      .step-h { display:flex; align-items:center; gap:11px; margin-bottom:14px; flex-wrap:wrap; }
      .step-no { width:30px; height:30px; flex-shrink:0; border-radius:50%; background:var(--lime); color:#1f2d05; font-weight:900; font-size:15px; display:grid; place-items:center; box-shadow:0 4px 10px -3px color-mix(in srgb,var(--lime),transparent 30%); }
      [data-theme="dark"] .step-no { color:#182200; }
      .step-h h2 { font-size:clamp(16px,2.1vw,19px); font-weight:800; letter-spacing:-.02em; }
      .step-h .opt { font-size:12px; font-weight:700; color:var(--dim); margin-left:auto; display:flex; gap:6px; }

      .seg { display:flex; gap:7px; margin-bottom:13px; flex-wrap:wrap; background:var(--bg); padding:5px; border-radius:14px; }
      .seg button { flex:1; min-width:90px; padding:10px; border-radius:10px; border:none; background:transparent; color:var(--dim); cursor:pointer; font-size:13.5px; font-weight:700; font-family:inherit; transition:all .2s; }
      .seg button.on { background:var(--card); color:var(--ink); box-shadow:0 2px 8px -2px rgba(35,29,19,.2); }

      .chip { padding:7px 12px; border-radius:10px; border:1px solid var(--line); background:var(--field); color:var(--ink); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; transition:all .15s; }
      .chip:hover { border-color:var(--lime); }
      .chip.on { background:var(--lime); color:#1f2d05; border-color:var(--lime); }
      .chip:disabled { opacity:.5; cursor:default; }

      .primary-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:13px 22px; border-radius:13px; border:none; background:var(--lime); color:#1f2d05; font-weight:800; font-size:14.5px; font-family:inherit; cursor:pointer; box-shadow:0 8px 18px -8px color-mix(in srgb,var(--lime),transparent 20%); transition:transform .14s, box-shadow .14s; }
      [data-theme="dark"] .primary-btn { color:#152000; }
      .primary-btn:hover { transform:translateY(-2px); box-shadow:0 12px 24px -8px color-mix(in srgb,var(--lime),transparent 10%); }
      .primary-btn:disabled { opacity:.55; cursor:default; transform:none; }
      .publish-btn { width:100%; padding:17px; font-size:16px; border-radius:16px; }

      /* 영상 그리드 */
      .vtools { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
      .vfilter { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
      .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:12px; padding:3px; }
      .pager { display:flex; gap:5px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
      .pager button { min-width:34px; padding:7px 10px; border-radius:9px; border:1px solid var(--line); background:var(--field); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer; transition:all .15s; }
      .pager button.active { background:var(--lime); border-color:var(--lime); color:#1f2d05; }
      .pager button:disabled { opacity:.4; cursor:default; }
      .pager .dots { padding:7px 4px; color:var(--dim); }
      .vcard { border:2px solid var(--line); border-radius:14px; overflow:hidden; background:var(--field); cursor:pointer; transition:border-color .15s, transform .15s; position:relative; }
      .vcard:hover { transform:translateY(-2px); }
      .vcard.sel { border-color:var(--lime); box-shadow:0 0 0 3px color-mix(in srgb,var(--lime),transparent 78%); }
      .vcard .vthumb { width:100%; aspect-ratio:9/16; object-fit:cover; background:#17130c; display:block; }
      .vcard .vthumb.land { aspect-ratio:16/9; }
      .vcard .vkind { display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; background:var(--bg); color:var(--lime-d); margin:6px 8px 0; }
      .vcard .vtitle { font-size:11.5px; font-weight:700; padding:5px 8px 3px; line-height:1.3; height:36px; overflow:hidden; }
      .vcard .vbadges { display:flex; gap:3px; padding:0 8px; min-height:14px; }
      .vcard .vbadges span { font-size:10px; }
      .vcard .vbtns { display:flex; gap:3px; padding:5px 6px 7px; }
      .vcard .vbtns button { flex:1; padding:6px 0; border-radius:8px; border:none; background:var(--bg); font-size:14px; cursor:pointer; transition:background .15s, transform .1s; }
      .vcard .vbtns button:hover { background:var(--lime); transform:scale(1.08); }
      .vcard .vcheck { position:absolute; top:7px; left:7px; width:23px; height:23px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:900; backdrop-filter:blur(3px); }
      .vcard.sel .vcheck { background:var(--lime); color:#1f2d05; }

      /* 계정 */
      .acct-list { max-height:380px; overflow:auto; }
      .acct-row { display:flex; align-items:center; gap:10px; padding:11px 13px; border:1.5px solid var(--line); border-radius:13px; margin-bottom:8px; background:var(--field); transition:border-color .2s; }
      .acct-row:hover { border-color:var(--lime); }
      .acct-row input[type=checkbox] { width:19px; height:19px; accent-color:var(--lime-d); flex-shrink:0; }
      .acct-row label { flex:1; font-size:14px; font-weight:600; cursor:pointer; }
      .acct-niche { font-size:12px; color:var(--dim); font-weight:500; }
      .mini-state { font-size:13.5px; color:var(--dim); padding:10px 2px; }
      .tip { display:flex; gap:8px; font-size:12.5px; color:var(--dim); margin-top:12px; line-height:1.55; background:color-mix(in srgb,var(--sun) 12%,var(--card)); padding:11px 13px; border-radius:12px; }

      /* 콘솔 */
      .console-card { margin-top:4px; }
      .bar { position:relative; height:28px; border-radius:14px; background:var(--bg); margin-top:14px; overflow:hidden; display:none; }
      .bar.on { display:block; }
      .bar-fill { height:100%; width:0; background:linear-gradient(90deg, var(--lime), var(--lime-d)); transition:width .4s ease; border-radius:14px; }
      .bar span { position:absolute; inset:0; display:grid; place-items:center; font-size:12.5px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
      .ss-log { font-family:ui-monospace,monospace; font-size:12.5px; line-height:1.7; background:#17130c; color:#bdf06a; border-radius:14px; padding:14px; max-height:300px; min-height:120px; overflow:auto; white-space:pre-wrap; margin-top:14px; }
      .ctrls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
      .bcast-opts { margin-bottom:14px; }
      .opt-row { display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-top:10px; font-size:13px; font-weight:700; color:var(--dim); }
      .opt-row label { display:flex; align-items:center; gap:7px; }
      .mini-sel { padding:8px 11px; border-radius:10px; border:1.5px solid var(--line); background:var(--field); color:var(--ink); font-size:13.5px; font-family:inherit; font-weight:700; }
      .sched-list { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
      .sched-item { display:flex; align-items:center; gap:10px; padding:11px 14px; border:1.5px solid var(--line); border-radius:13px; background:var(--field); font-size:13px; }
      .sched-item .si-when { font-weight:800; color:var(--lime-d); white-space:nowrap; }
      .sched-item .si-meta { color:var(--dim); flex:1; }
      .sched-item button { padding:6px 11px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--terra); font-weight:700; font-size:12px; cursor:pointer; }
      .ctrl { padding:11px 18px; font-size:13.5px; }
      .hidden { display:none !important; }

      /* 크게보기 모달 */
      .big-modal { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:100; display:none; place-items:center; padding:20px; }
      .big-modal.on { display:grid; }
      .big-modal .bm-in { background:#17130c; color:#bdf06a; border-radius:18px; padding:20px; max-width:940px; width:100%; max-height:82vh; overflow:auto; font-family:ui-monospace,monospace; font-size:14px; line-height:1.8; white-space:pre-wrap; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); }
      .big-modal .bm-x { position:absolute; top:22px; right:26px; width:42px; height:42px; border-radius:50%; border:none; background:var(--card); color:var(--ink); font-size:20px; cursor:pointer; }

      /* 폭죽 */
      .confetti { position:fixed; top:-20px; font-size:22px; z-index:120; pointer-events:none; animation:fall linear forwards; }
      @keyframes fall { to { transform:translateY(105vh) rotate(540deg); opacity:.2; } }

      @media (max-width:560px){
        .welcome { flex-direction:row; }
        .vgrid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
        .seg button { min-width:70px; font-size:12.5px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="head">
        <a href="/ppurio" class="back" title="뿌리오 홈(랜딩)으로">←</a>
        <a href="/ppurio" class="brand" style="text-decoration:none"><img src="/ppurio-assets/puri.png" alt="뿌리오" /> 뿌리오 <small>방송콘솔</small></a>
        <button id="theme-btn" title="밝게/어둡게">🌙</button>
      </div>
    </header>

    <div class="wrap">
      <div class="welcome">
        <img class="wpic" src="/ppurio-assets/puri.png" alt="뿌리오 마스코트" />
        <div>
          <h1>한 번에 <span class="fr">사방</span>으로<br/>송출하세요</h1>
          <p>영상을 고르고 계정을 고르면, 스레드·인스타·페북 전 계정에 순서대로 뿌려드려요.</p>
        </div>
      </div>

      <div class="work-grid">
        <div class="col-main">
          <div class="step-card">
            <div class="step-h"><span class="step-no">1</span><h2>영상 선택</h2><span class="opt" id="vsel-count">0개 선택</span></div>
            <div class="vfilter" id="vfilter">
              <button class="chip on" data-f="all">전체</button>
              <button class="chip" data-f="video">🎞 영상</button>
              <button class="chip" data-f="remake">🎭 재창작</button>
              <button class="chip" data-f="create">✍️ 창작</button>
              <button class="chip" data-f="card">🎴 카드</button>
              <button class="chip" data-f="highlight">🎬 하이라이트</button>
            </div>
            <div class="vtools">
              <button id="v-all" class="chip">전체 선택</button>
              <button id="v-none" class="chip">해제</button>
              <button id="v-reload" class="chip">↻ 새로고침</button>
            </div>
            <div id="vgrid" class="vgrid"><p class="mini-state">영상 불러오는 중…</p></div>
            <div id="vpager" class="pager"></div>
          </div>
        </div>

        <div class="col-side">
          <div class="step-card">
            <div class="step-h"><span class="step-no">2</span><h2>송출 대상 계정</h2></div>
            <div class="seg" id="plat-seg">
              <button data-plat="threads" class="on">🧵 스레드</button>
              <button data-plat="instagram">📷 인스타</button>
              <button data-plat="facebook">👍 페북</button>
            </div>
            <div class="vtools"><button id="a-all" class="chip">전체 선택/해제</button><span class="mini-state" id="asel-count" style="padding:0"></span></div>
            <div id="accts" class="acct-list"><p class="mini-state">계정 불러오는 중…</p></div>
            <div class="tip">💡 한 기기·한 계정·텀을 두고 올려야 안 걸려요. 계정마다 주제를 섞지 마세요.</div>
          </div>
        </div>
      </div>

      <div class="step-card console-card">
        <div class="step-h"><span class="step-no">3</span><h2>송출 콘솔</h2>
          <span class="opt">
            <button id="c-big" class="chip">🔍 크게</button>
            <button id="c-copy" class="chip">📋 복사</button>
            <button id="c-clear" class="chip">🧹 초기화</button>
          </span>
        </div>
        <div class="bcast-opts">
          <div class="seg" id="mode-seg">
            <button data-mode="now" class="on">⚡ 지금 송출</button>
            <button data-mode="schedule">⏰ 예약 송출</button>
          </div>
          <div class="opt-row">
            <label>계정 간격
              <select id="interval" class="mini-sel"><option value="0">즉시(간격 없음)</option><option value="60">1분</option><option value="180">3분</option><option value="300">5분</option></select>
              <span class="small sub">봇 차단 회피</span>
            </label>
            <label id="sched-time-wrap" class="hidden">예약 시각
              <input type="datetime-local" id="sched-time" class="mini-sel" />
            </label>
          </div>
        </div>
        <button id="broadcast" class="primary-btn publish-btn">🚀 선택한 영상을 선택한 계정에 송출</button>
        <div class="bar" id="bar"><div class="bar-fill" id="bar-fill"></div><span id="bar-txt">0%</span></div>
        <div id="con" class="ss-log">여기에 송출 로그가 실시간으로 올라옵니다. 영상과 계정을 고르고 🚀 송출을 눌러보세요.</div>
        <div class="ctrls">
          <button id="c-stop" class="chip ctrl hidden">⏹ 정지</button>
          <button id="c-resume" class="chip ctrl hidden">▶ 이어하기</button>
          <button id="c-cancel" class="chip ctrl hidden">✕ 취소</button>
        </div>
        <div id="sched-list" class="sched-list"></div>
      </div>
    </div>

    <div class="big-modal" id="big-modal"><button class="bm-x" id="bm-x">✕</button><div class="bm-in" id="bm-in"></div></div>

    <script src="/social.js"></script>
  </body>
</html>
