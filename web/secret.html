<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>· · ·</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{
    --bg:#070b09; --panel:#0c1411; --panel2:#0f1b16; --line:#1a2e26;
    --neon:#00ffa3; --neon2:#7cffd4; --amber:#ffd24a; --red:#ff5c6c;
    --tx:#cdeede; --dim:#5e7d70; --dim2:#3f5a4f;
    --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0,255,163,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(0,255,163,.05), transparent 55%),
      var(--bg);
    color:var(--tx); font-family:var(--mono); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  /* 미세 스캔라인(관제실 CRT 느낌, 아주 옅게) */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);mix-blend-mode:overlay}
  .wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:18px 16px 48px}

  /* ── 게이트(비번) ── */
  #gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:var(--bg);flex-direction:column;gap:18px}
  #gate .mark{color:var(--neon);letter-spacing:.5em;font-size:13px;opacity:.7}
  #gate .box{display:flex;flex-direction:column;gap:12px;align-items:center}
  #gate input{background:#000;border:1px solid var(--line);color:var(--neon);font-family:var(--mono);
    font-size:22px;letter-spacing:.4em;text-align:center;padding:14px 18px;border-radius:10px;width:220px;outline:none}
  #gate input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,255,163,.15)}
  #gate .hint{color:var(--dim2);font-size:12px}
  #gate .err{color:var(--red);font-size:12px;min-height:14px}

  /* ── 헤더 ── */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 16px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));margin-bottom:16px}
  .led{width:11px;height:11px;border-radius:50%;background:var(--dim2);box-shadow:0 0 0 3px rgba(255,255,255,.02)}
  .led.on{background:var(--neon);box-shadow:0 0 10px var(--neon),0 0 0 3px rgba(0,255,163,.15);animation:pulse 1.6s infinite}
  .led.pause{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .title{font-weight:600;letter-spacing:.18em;color:var(--neon2)}
  .title b{color:var(--neon)}
  .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .stat{display:flex;gap:16px;align-items:center}
  .stat .k{color:var(--dim);font-size:11px}
  .stat .v{color:var(--neon);font-size:20px;font-weight:700}
  .badge{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

  /* ── 2컬럼 ── */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px}
  .card h3{margin:0 0 12px;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}

  label.f{display:block;margin:0 0 12px}
  label.f span{display:block;color:var(--dim);font-size:11px;margin-bottom:5px;letter-spacing:.05em}
  input.t,select.t{width:100%;background:#000;border:1px solid var(--line);color:var(--tx);
    font-family:var(--mono);font-size:14px;padding:10px 12px;border-radius:9px;outline:none}
  input.t:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,255,163,.12)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:10px;cursor:pointer}
  .toggle .lab{font-size:12px;color:var(--tx)}
  .toggle .lab i{display:block;color:var(--dim2);font-size:10px;font-style:normal;margin-top:2px}
  .sw{width:40px;height:22px;border-radius:999px;background:#1a211e;position:relative;transition:.2s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#4a5a52;transition:.2s}
  .toggle.on .sw{background:rgba(0,255,163,.25)}
  .toggle.on .sw::after{left:20px;background:var(--neon);box-shadow:0 0 8px var(--neon)}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  button.b{font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:11px 10px;border-radius:9px;cursor:pointer;
    background:#0a120f;border:1px solid var(--line);color:var(--tx);transition:.15s}
  button.b:hover{border-color:var(--neon);color:var(--neon)}
  button.b.go{grid-column:1/-1;background:linear-gradient(180deg,rgba(0,255,163,.22),rgba(0,255,163,.08));
    border-color:rgba(0,255,163,.5);color:var(--neon);font-weight:700}
  button.b.go:hover{box-shadow:0 0 16px rgba(0,255,163,.3)}
  button.b.danger:hover{border-color:var(--red);color:var(--red)}
  button.b:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--dim)}

  /* 창보기 안내 + 스샷 */
  .viewer{min-height:180px;display:flex;flex-direction:column;gap:10px}
  .viewer .note{color:var(--dim);font-size:12px;line-height:1.7;border:1px dashed var(--line);border-radius:10px;padding:12px}
  .viewer .note b{color:var(--neon2)}
  .shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
  .shot img{display:block;width:100%;cursor:zoom-in}
  .shot .cap{font-size:11px;color:var(--dim);padding:6px 10px}

  /* 로그 터미널 */
  .logwrap{margin-top:16px}
  .logbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .logbar h3{margin:0}
  .logbar .tools{margin-left:auto;display:flex;gap:6px}
  .logbar .tools button{font-size:11px;padding:6px 10px;border-radius:8px;background:#0a120f;border:1px solid var(--line);color:var(--dim);cursor:pointer;font-family:var(--mono)}
  .logbar .tools button:hover{border-color:var(--neon);color:var(--neon)}
  #log{height:300px;overflow:auto;background:#040807;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
  #log .ln{display:flex;gap:10px;padding:1px 0;white-space:pre-wrap;word-break:break-word}
  #log .ln .ts{color:var(--dim2);flex:none}
  #log .ln .mg{color:var(--tx)}
  #log .ln.ok .mg{color:var(--neon)}
  #log .ln.warn .mg{color:var(--amber)}
  #log .ln.err .mg{color:var(--red)}
  #log .ln img{height:54px;border:1px solid var(--line);border-radius:6px;margin-left:6px;cursor:zoom-in;vertical-align:middle}

  /* 모달(크게보기) */
  #modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:20px}
  #modal.show{display:flex}
  #modal .mc{max-width:92vw;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  #modal img{max-width:88vw;max-height:84vh;display:block;border-radius:8px}
  #modal pre{margin:0;max-width:88vw;max-height:84vh;overflow:auto;white-space:pre-wrap;color:var(--tx);font-family:var(--mono);font-size:13px}
  #modal .x{float:right;background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;cursor:pointer;padding:4px 10px;font-family:var(--mono)}
  .foot{color:var(--dim2);font-size:11px;text-align:center;margin-top:26px;letter-spacing:.1em}
</style>
</head>
<body>
  <!-- 비번 게이트 -->
  <div id="gate">
    <div class="mark">● SECRET</div>
    <div class="box">
      <input id="gate-pw" type="password" inputmode="numeric" placeholder="······" autocomplete="off">
      <div class="err" id="gate-err"></div>
      <div class="hint">접근 코드를 입력하세요</div>
    </div>
  </div>

  <div class="wrap" id="app" style="display:none">
    <header>
      <span class="led" id="led"></span>
      <span class="title">● <b>SECRET</b> · 스레드 댓글 콘솔</span>
      <span class="badge" id="st-badge">정지</span>
      <span class="spacer"></span>
      <div class="stat">
        <div><span class="k">오늘 댓글</span> <span class="v" id="st-count">0</span></div>
      </div>
    </header>

    <div class="grid">
      <!-- 좌: 컨트롤 -->
      <div class="card">
        <h3>작동 설정</h3>
        <label class="f"><span>계정 이름(라벨)</span><input class="t" id="f-account" value="main" placeholder="main"></label>
        <label class="f"><span>키워드</span><input class="t" id="f-keyword" placeholder="예: 먹방, 다이어트 식단"></label>
        <div class="row2">
          <label class="f"><span>하루 한도(개)</span><input class="t" id="f-limit" type="number" value="20" min="1" max="500"></label>
          <label class="f"><span>댓글 간 텀(초)</span><input class="t" id="f-term" type="number" value="180" min="30" max="3600"></label>
        </div>
        <div class="toggle" id="tg-proxy"><div class="lab">프록시<i>OFF=내 IP(기본) · ON=고정 IP</i></div><div class="sw"></div></div>
        <div class="toggle on" id="tg-visible"><div class="lab">창보기<i>봇 크롬창을 화면에 띄움</i></div><div class="sw"></div></div>
        <div class="btns">
          <button class="b go" id="b-start">▶ 시작</button>
          <button class="b" id="b-pause">⏸ 일시정지</button>
          <button class="b" id="b-resume">▶ 이어하기</button>
          <button class="b danger" id="b-stop">■ 정지</button>
          <button class="b danger" id="b-cancel">✕ 취소</button>
        </div>
      </div>

      <!-- 우: 창보기/스샷 -->
      <div class="card">
        <h3>창보기 (라이브)</h3>
        <div class="viewer">
          <div class="note" id="view-note">봇은 <b>네 맥</b>에서 실제 크롬창을 띄워 움직여요(창보기 ON).<br>여기엔 <b>봇이 캡처한 최근 화면</b>이 뜹니다 — 실제 창은 네 맥에서 직접 볼 수 있어요.</div>
          <div class="shot" id="shot" style="display:none"><img id="shot-img" alt="봇 캡처"><div class="cap" id="shot-cap"></div></div>
        </div>
      </div>
    </div>

    <!-- 로그 -->
    <div class="logwrap">
      <div class="logbar">
        <h3>실시간 로그</h3>
        <div class="tools">
          <button id="b-copy">⧉ 복사</button>
          <button id="b-big">⛶ 크게보기</button>
          <button id="b-clear">로그 비우기</button>
        </div>
      </div>
      <div id="log"></div>
    </div>

    <div class="foot">ONVIDEO · SECRET CONSOLE · 로컬 봇이 네 맥에서 작동합니다</div>
  </div>

  <div id="modal"><div class="mc"><button class="x" id="modal-x">✕ 닫기</button><div id="modal-body"></div></div></div>

  <script src="secret.js"></script>
</body>
</html>
