<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnVideo — 목소리 듣고 고르기</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .voice-groups { display: flex; flex-direction: column; gap: 26px; }
      .vg-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
      .vg-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
      .vcard {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px;
      }
      .vcard .play {
        width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; border: none; cursor: pointer;
        background: var(--grad); color: #fff; font-size: 20px;
      }
      .vcard .play.loading { opacity: 0.5; }
      .vcard .vmeta { flex: 1; }
      .vcard .vname { font-weight: 800; font-size: 15px; }
      .vcard .vgender { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; }
      .vcard .vtip { font-size: 12.5px; color: var(--teal); margin-top: 4px; }
      .vcard.playing { border-color: var(--teal); }
      .back-link { color: var(--accent); text-decoration: none; font-size: 14px; }
      /* 내가 만든 영상 — 관리용 컴팩트 그리드(영상 많아져도 한눈에). PC 다열, 모바일 2열. */
      .mypf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .mypf-grid .pf-card h3 { font-size: 14px; }
      .mypf-grid .pf-card figcaption { padding: 12px 12px 14px; }
      .pf-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .pf-del { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
      .pf-del:hover { border-color: #ff6b5e; color: #ff6b5e; }
      .pf-yt { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
      .pf-yt:hover { border-color: #ff0000; color: #ff4d4d; }
      .pf-yt:disabled { opacity: .5; cursor: default; }
      .pf-yt-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: #ff4d4d; text-decoration: none; }
      /* 컴팩트 썸네일 카드 — 세로로 안 길어지게 */
      .pf-thumb-card { cursor: pointer; }
      .pf-thumb { position: relative; aspect-ratio: 9/16; background: #000; border-radius: 12px 12px 0 0; overflow: hidden; }
      .pf-thumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
      .pf-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); opacity: .92; }
      .pf-yt-badge { position: absolute; top: 8px; right: 8px; background: #ff0000; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
      .pf-thumb-card figcaption { padding: 10px 12px 14px; }
      .pf-thumb-card h3 { font-size: 13px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      /* 크게보기 모달 */
      .big-inner { position: relative; background: var(--card); border-radius: 18px; max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto; display: flex; gap: 20px; padding: 20px; }
      .big-video { width: 46%; max-width: 360px; aspect-ratio: 9/16; border-radius: 12px; background: #000; flex-shrink: 0; }
      .big-meta { flex: 1; min-width: 0; }
      .big-meta h3 { font-size: 18px; margin: 8px 0; }
      .big-close { position: absolute; top: 10px; right: 12px; background: var(--card2); border: 1px solid var(--line); color: var(--text); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; z-index: 2; }
      @media (max-width: 640px) {
        .big-inner { flex-direction: column; align-items: center; }
        .big-video { width: 100%; max-width: 240px; }
        .big-meta { width: 100%; text-align: center; }
        .big-meta .pf-actions { justify-content: center; }
      }
      .mypf-count { font-weight: 700; color: var(--teal); }
      @media (max-width: 640px) {
        .mypf-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .mypf-grid .pf-card figcaption { padding: 10px; }
        .mypf-grid .pf-card h3 { font-size: 13px; }
        .mypf-grid .pf-voice-note, .mypf-grid .pf-clip { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:8px">
        <div class="wordmark">On<span>Video</span></div>
        <span class="ver-badge"><span class="live-dot"></span><span id="ver">v–</span></span>
      </div>
      <div style="display:flex; gap:8px; align-items:center">
        <button id="theme-btn" class="ghost-btn small" title="밝게/어둡게">🌙</button>
        <a href="/" class="back-link">← 영상 만들기</a>
      </div>
    </header>

    <main class="wrap">
      <p class="eyebrow">VOICE GUIDE</p>
      <h1 class="hero">목소리 듣고 고르기</h1>
      <p class="sub">재생 버튼을 눌러 직접 들어보세요. 콘텐츠에 맞는 목소리를 쓰면 시청 시간이 확 늘어납니다.</p>

      <!-- 내가 만든 영상(완성 시 자동 등록) -->
      <section class="portfolio" id="my-videos" hidden>
        <div class="portfolio-head">
          <h2 class="pf-title">🎬 내가 만든 영상 <span id="mypf-count" class="mypf-count"></span></h2>
          <p class="pf-sub">완성한 영상이 여기에 자동으로 쌓입니다. 최신순으로 정렬돼요.</p>
        </div>
        <div id="mypf-grid" class="mypf-grid"></div>
        <div style="text-align:center; margin-top:18px"><button id="mypf-more" class="ghost-btn" hidden>더 보기</button></div>
      </section>

      <section class="portfolio">
        <div class="portfolio-head">
          <h2 class="pf-title">🎬 실제 제작 영상 — 목소리 들어보기</h2>
          <p class="pf-sub">OnVideo가 자동 생성한 실제 영상입니다. 소리를 켜고 목소리 톤을 확인해 보세요.</p>
        </div>
        <div class="pf-grid">
          <figure class="pf-card">
            <video class="pf-video" src="/portfolio/gulbi-luna.mp4" controls playsinline preload="metadata"></video>
            <figcaption>
              <span class="pf-badge sell">🛍️ 판매·음식</span>
              <h3>Luna · 다정 여성</h3>
              <p class="pf-voice-note">다정하고 부드러운 톤. 음식·감성 콘텐츠를 사랑스럽게.</p>
              <p class="pf-clip">영광 법성포 굴비 (온종일팜)</p>
            </figcaption>
          </figure>
          <figure class="pf-card">
            <video class="pf-video" src="/portfolio/city-shin.mp4" controls playsinline preload="metadata"></video>
            <figcaption>
              <span class="pf-badge issue">📰 이슈·미스터리</span>
              <h3>Shin · 깊고 묵직</h3>
              <p class="pf-voice-note">깊고 묵직한 저음. 사건·다큐에 긴장감과 몰입을.</p>
              <p class="pf-clip">사라진 도시, 인구 절벽의 미래</p>
            </figcaption>
          </figure>
          <figure class="pf-card">
            <video class="pf-video" src="/portfolio/greentea-suzie.mp4" controls playsinline preload="metadata"></video>
            <figcaption>
              <span class="pf-badge info">💡 정보·건강</span>
              <h3>Suzie · 차분 30대</h3>
              <p class="pf-voice-note">차분한 30대 여성. 건강·정보를 편안하고 신뢰감 있게.</p>
              <p class="pf-clip">녹차 카페인, 이렇게 마시면 꿀팁</p>
            </figcaption>
          </figure>
          <figure class="pf-card">
            <video class="pf-video" src="/portfolio/kidney-suzie.mp4" controls playsinline preload="metadata"></video>
            <figcaption>
              <span class="pf-badge info">💡 정보·건강</span>
              <h3>Suzie · 차분 30대</h3>
              <p class="pf-voice-note">링크·이미지 없이 <b>주제 추천</b>만으로 만든 영상.</p>
              <p class="pf-clip">물 마실 때 신장 망가지는 습관</p>
            </figcaption>
          </figure>
          <figure class="pf-card">
            <video class="pf-video" src="/portfolio/ocean-anime.mp4" controls playsinline preload="metadata"></video>
            <figcaption>
              <span class="pf-badge issue">🎨 애니 스타일</span>
              <h3>Jaewon · 자연스러운</h3>
              <p class="pf-voice-note"><b>애니 일러스트</b> 스타일 + 주제 추천으로 제작.</p>
              <p class="pf-clip">바다에서 절대 하면 안 되는 행동</p>
            </figcaption>
          </figure>
        </div>
      </section>

      <h2 class="pf-title" style="margin-top:36px">🔊 전체 목소리 미리듣기</h2>
      <div id="groups" class="voice-groups"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      // 이미지·영상 롱프레스/우클릭 메뉴(공유·저장) 차단
      document.addEventListener('contextmenu', (e) => { if (e.target && /^(IMG|VIDEO)$/.test(e.target.tagName)) e.preventDefault(); });
      // 다크/라이트 토글 (index와 lvm-theme 공유, 기본 라이트)
      function applyTheme(t) {
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        const b = $('theme-btn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
      }
      applyTheme(localStorage.getItem('lvm-theme') || 'light');
      $('theme-btn')?.addEventListener('click', () => {
        const next = (localStorage.getItem('lvm-theme') || 'light') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lvm-theme', next); applyTheme(next);
      });
      fetch('/api/version').then(r => r.json()).then(d => { const v = $('ver'); if (v) v.textContent = 'v' + (d.version || '?'); }).catch(() => {});
      const USE_LABEL = {
        issue: { t: '📰 이슈·미스터리·경고', d: '무게감과 긴장감으로 몰입시켜야 할 때' },
        info: { t: '💡 정보·건강·상식', d: '차분하고 신뢰가는 설명이 필요할 때' },
        sell: { t: '🛍️ 판매·리뷰·홍보', d: '밝고 에너지 있게 구매를 자극할 때' },
        heal: { t: '🌿 힐링·음식·여행', d: '따뜻하고 감성적인 분위기가 필요할 때' },
      };
      let curAudio = null, curCard = null;

      async function load() {
        const d = await (await fetch('/api/categories')).json();
        const groups = {};
        for (const v of d.voices) {
          // 첫 용도를 대표 그룹으로
          const g = v.use[0];
          (groups[g] = groups[g] || []).push(v);
        }
        const wrap = $('groups');
        wrap.innerHTML = '';
        for (const key of ['issue', 'info', 'sell', 'heal']) {
          if (!groups[key]) continue;
          const box = document.createElement('div');
          box.innerHTML = `<div class="vg-title">${USE_LABEL[key].t}</div><div class="vg-desc">${USE_LABEL[key].d}</div>`;
          for (const v of groups[key]) {
            const card = document.createElement('div');
            card.className = 'vcard';
            card.innerHTML = `
              <button class="play" data-voice="${v.id}">▶</button>
              <div class="vmeta">
                <div><span class="vname">${v.label}</span><span class="vgender">${v.gender}</span></div>
                <div class="vtip">${v.tip}</div>
              </div>`;
            box.appendChild(card);
          }
          wrap.appendChild(box);
        }
        document.querySelectorAll('.play').forEach((btn) => (btn.onclick = () => play(btn)));
      }

      async function play(btn) {
        const voice = btn.dataset.voice;
        const card = btn.closest('.vcard');
        if (curAudio) { curAudio.pause(); curAudio = null; }
        if (curCard) curCard.classList.remove('playing');
        btn.classList.add('loading');
        btn.textContent = '…';
        try {
          const r = await fetch('/api/voice-preview?voice=' + encodeURIComponent(voice));
          if (!r.ok) throw new Error((await r.json()).error || '실패');
          const url = URL.createObjectURL(await r.blob());
          curAudio = new Audio(url);
          curCard = card;
          card.classList.add('playing');
          curAudio.onended = () => { card.classList.remove('playing'); btn.textContent = '▶'; };
          await curAudio.play();
          btn.textContent = '❚❚';
        } catch (e) {
          alert(e.message);
          btn.textContent = '▶';
        }
        btn.classList.remove('loading');
      }
      load();

      // ── 내가 만든 영상(자동 포트폴리오) ──
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const BADGE = { issue:'📰', info:'💡', sell:'🛍️', heal:'🌿' };
      let myItems = [], myShown = 0, canDelete = false;
      const PAGE = 9;
      async function loadMyVideos() {
        try {
          const a = await (await fetch('/api/auth')).json();
          canDelete = !a.required || a.ok; // 로그인(또는 비번 미설정) 시에만 삭제 버튼
          const d = await (await fetch('/api/portfolio')).json();
          myItems = Array.isArray(d.items) ? d.items : [];
        } catch { myItems = []; }
        const sec = $('my-videos');
        if (!myItems.length) { sec.hidden = true; return; }
        sec.hidden = false;
        $('mypf-count').textContent = `(총 ${myItems.length}개)`;
        myShown = 0; $('mypf-grid').innerHTML = ''; showMore();
      }
      function showMore() {
        const grid = $('mypf-grid');
        for (let i = myShown; i < Math.min(myShown + PAGE, myItems.length); i++) {
          const it = myItems[i];
          const fig = document.createElement('figure');
          fig.className = 'pf-card pf-thumb-card';
          fig.dataset.idx = i;
          // 카드는 썸네일+제목만(컴팩트) — 탭하면 크게보기 모달. 세로로 안 길어짐.
          fig.innerHTML = `
            <div class="pf-thumb"><video src="${it.video}#t=0.5" playsinline preload="metadata" muted></video><span class="pf-play">▶</span>${it.youtubeUrl ? '<span class="pf-yt-badge">YT</span>' : ''}</div>
            <figcaption>
              <span class="pf-badge ${esc(it.goal)}">${BADGE[it.goal] || '🎬'} ${esc(it.category)}</span>
              <h3>${esc(it.title)}</h3>
            </figcaption>`;
          grid.appendChild(fig);
        }
        myShown = Math.min(myShown + PAGE, myItems.length);
        $('mypf-more').hidden = myShown >= myItems.length;
      }
      // 카드 크게보기 모달 — 영상 크게 재생 + 정보 + 유튜브/삭제.
      function openBig(idx) {
        const it = myItems[idx]; if (!it) return;
        let box = $('big-modal');
        if (!box) { box = document.createElement('div'); box.id = 'big-modal'; document.body.appendChild(box); }
        box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60';
        box.innerHTML = `<div class="big-inner">
          <button class="big-close" data-big="close">✕</button>
          <video class="big-video" src="${it.video}" controls autoplay playsinline></video>
          <div class="big-meta">
            <span class="pf-badge ${esc(it.goal)}">${BADGE[it.goal] || '🎬'} ${esc(it.category)}</span>
            <h3>${esc(it.title)}</h3>
            <p class="pf-voice-note">🎙 ${esc(it.voice)}</p>
            <p class="pf-clip">${esc(new Date(it.createdAt).toLocaleString('ko-KR'))}</p>
            ${it.youtubeUrl ? `<a class="pf-yt-link" href="${esc(it.youtubeUrl)}" target="_blank">▶ 유튜브에서 보기</a>` : ''}
            ${canDelete ? `<div class="pf-actions"><button class="pf-yt" data-id="${esc(it.projectId)}">📺 유튜브 올리기</button><button class="pf-del" data-id="${esc(it.projectId)}">🗑 삭제</button></div>` : ''}
          </div>
        </div>`;
        box.onclick = e => {
          if (e.target === box || e.target.closest('[data-big="close"]')) { box.remove(); return; }
          const yt = e.target.closest('.pf-yt'); if (yt) { box.remove(); uploadToYouTube(yt); return; }
          const del = e.target.closest('.pf-del');
          if (del) { if (confirm('이 영상을 포트폴리오에서 삭제할까요? (원본 작업은 남아 있어요)')) { fetch('/api/portfolio/' + encodeURIComponent(del.dataset.id), { method: 'DELETE' }).then(r => { if (r.ok) { box.remove(); loadMyVideos(); } }); } }
        };
      }
      $('mypf-more').onclick = showMore;
      $('mypf-grid').onclick = e => {
        const card = e.target.closest('.pf-thumb-card');
        if (card) openBig(Number(card.dataset.idx));
      };

      // ── 포트폴리오 카드 → 유튜브 올리기 ──
      async function uploadToYouTube(btn) {
        const id = btn.dataset.id;
        const orig = btn.textContent; btn.disabled = true; btn.textContent = '📺 준비 중…';
        try {
          const st = await (await fetch('/api/youtube/status')).json();
          if (!st.connected) { alert('먼저 영상 만들기 화면의 ⚙ 키 설정에서 유튜브 계정을 연결하세요.'); btn.disabled = false; btn.textContent = orig; return; }
          btn.textContent = '📺 제목·설명 만드는 중…';
          const r = await fetch('/api/youtube/meta/' + id);
          const meta = await r.json();
          if (!r.ok) throw new Error(meta.error || '메타 생성 실패');
          openYtModal(id, meta, st.channelTitle);
        } catch (e) { alert(e.message); }
        finally { btn.disabled = false; btn.textContent = orig; }
      }
      function openYtModal(id, meta, channel) {
        let box = $('yt-modal');
        if (!box) { box = document.createElement('div'); box.id = 'yt-modal'; box.className = 'modal'; document.body.appendChild(box); }
        box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50';
        box.innerHTML = `<div class="modal-box" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto">
          <div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2>📺 유튜브 올리기</h2><button class="ghost-btn" data-yt="close">✕</button></div>
          <p class="sub small">${channel ? '채널: <b>' + esc(channel) + '</b> · ' : ''}제목·설명은 수정할 수 있어요.</p>
          <label class="field-label">제목<input id="yt-title" class="input" maxlength="100" value="${esc(meta.title || '')}" /></label>
          <label class="field-label">설명<textarea id="yt-desc" class="input" rows="6" maxlength="4900">${esc(meta.description || '')}</textarea></label>
          <label class="field-label">태그(쉼표로 구분)<input id="yt-tags" class="input" value="${esc((meta.tags || []).join(', '))}" /></label>
          <label class="field-label">공개 범위<select id="yt-privacy" class="input">
            <option value="public" selected>바로 공개</option><option value="unlisted">미등록(링크만)</option><option value="private">비공개</option>
          </select></label>
          <button class="primary-btn" data-yt="upload">유튜브에 올리기</button>
          <p id="yt-up-msg" class="mini-state"></p>
        </div>`;
        box.onclick = async e => {
          const act = e.target.closest('[data-yt]')?.dataset.yt;
          if (act === 'close' || e.target === box) { box.remove(); return; }
          if (act === 'upload') {
            const up = e.target; up.disabled = true; up.textContent = '올리는 중… (잠시 걸려요)';
            $('yt-up-msg').textContent = '';
            try {
              const r = await fetch('/api/youtube/upload/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: $('yt-title').value, description: $('yt-desc').value, tags: $('yt-tags').value.split(',').map(s => s.trim()).filter(Boolean), privacy: $('yt-privacy').value }) });
              const d = await r.json();
              if (!r.ok) throw new Error(d.error || '업로드 실패');
              $('yt-up-msg').innerHTML = `✅ 업로드 완료! <a href="${d.url}" target="_blank" style="color:var(--teal)">${d.url}</a>`;
              up.textContent = '완료 🎉';
              loadMyVideos();
            } catch (err) { $('yt-up-msg').textContent = '실패: ' + err.message; up.disabled = false; up.textContent = '유튜브에 올리기'; }
          }
        };
      }
      loadMyVideos();
    </script>
  </body>
</html>
